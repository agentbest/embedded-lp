<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- OGP画像（1200×630）の原本。再出力手順は同じフォルダの README.md -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;box-sizing:border-box;background:#0F0D18;color:#EBE8F5;
    font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;
    background-image:radial-gradient(ellipse 70% 90% at 100% 0%,#171426 0%,#0F0D18 70%);
    border-left:14px solid #A78BFA}
  .in{position:absolute;left:84px;right:84px;top:0;bottom:130px;display:flex;flex-direction:column;justify-content:center}
  .eye{margin:0 0 30px;font-size:24px;font-weight:700;letter-spacing:.08em;color:#A78BFA;display:flex;align-items:center;gap:16px}
  .eye::before{content:"";width:40px;height:3px;background:#A78BFA;display:block}
  h1{margin:0;font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;font-weight:700;font-size:66px;line-height:1.3;letter-spacing:.02em}
  h1 .hl{color:#A78BFA}
  .sub{margin:30px 0 0;font-size:25px;color:#9C95B5;letter-spacing:.04em}
  .foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
  .foot img{height:46px;display:block}
  .foot span{font-family:Consolas,monospace;font-size:21px;color:#9C95B5;letter-spacing:.03em}
</style></head>
<body>
  <div class="in">
    <p class="eye">IoT・組込みエンジニアの転職</p>
    <h1>あなたの年収は、<br>スキルではなく<br><span class="hl">座組みで決まっている。</span></h1>
    
  </div>
  <div class="foot"><img src="../../logo-white.png" alt="エージェントベスト"><span>embedded.agent-best.net</span></div>
</body></html>
